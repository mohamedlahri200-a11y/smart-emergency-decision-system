

##################################################
# Application
##################################################

spring.application.name=app-backend

##################################################
# MYSQL
##################################################

spring.datasource.url=jdbc:mysql://localhost:3306/app_backend?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

##################################################
# JWT
##################################################

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

##################################################
# FASTAPI
##################################################

fastapi.base-url=http://ai-microservice:8000/api/v1

##################################################
# SERVER
##################################################

server.port=8080

##################################################
# AI MICROSERVICE
##################################################

ai.service.base-url=http://ai-microservice:8000/api/v1
ai.service.connect-timeout-ms=5000
ai.service.response-timeout-ms=20000
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads
