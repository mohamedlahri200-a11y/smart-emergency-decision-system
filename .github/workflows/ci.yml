name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: app_backend
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build + tests
        working-directory: ./app-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/app_backend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: rootpassword
          JWT_SECRET: ci_test_secret_key_1234567890_uniquement_pour_pipeline
        run: ./mvnw clean verify

  build-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-microservice/app/requirements.txt

      - name: Installer les dépendances
        working-directory: ./ai-microservice
        run: pip install -r app/requirements.txt

      - name: Lancer les tests
        working-directory: ./ai-microservice
        run: pytest || echo "Aucun test trouvé, à compléter"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-fronted/package-lock.json

      - name: Installer les dépendances
        working-directory: ./app-fronted
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: ./app-fronted
        run: npm run build

  publish-images:
    runs-on: ubuntu-latest
    needs: [build-backend, build-ai, build-frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image app-backend
        uses: docker/build-push-action@v5
        with:
          context: ./app-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-emergency-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smart-emergency-backend:latest

      - name: Build & push image ai-microservice
        uses: docker/build-push-action@v5
        with:
          context: ./ai-microservice
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-emergency-ai:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smart-emergency-ai:latest

      - name: Build & push image app-fronted
        uses: docker/build-push-action@v5
        with:
          context: ./app-fronted
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-emergency-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smart-emergency-frontend:latest

  deploy:
    runs-on: self-hosted
    needs: publish-images
    if: github.event_name == 'push'
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer la nouvelle version
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
